<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c5cd6"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="600" y="72" text-anchor="middle" font-size="27" fill="#7c5cd6">HTTPS &#8226; Bearer Token &#8226; MCP</text>

  <!-- Top row -->
  <g>
    <rect x="30" y="110" width="290" height="150" rx="18" fill="#efeafd" stroke="#9a9aad" stroke-width="1.5"/>
    <text x="175" y="178" text-anchor="middle" font-size="31" font-weight="600" fill="#111111">Notion Agent</text>
    <text x="175" y="218" text-anchor="middle" font-size="27" fill="#111111">(Cloud)</text>
  </g>
  <line x1="330" y1="185" x2="445" y2="185" stroke="#7c5cd6" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="455" y="110" width="290" height="150" rx="18" fill="#efeafd" stroke="#9a9aad" stroke-width="1.5"/>
    <text x="600" y="178" text-anchor="middle" font-size="31" font-weight="600" fill="#111111">Cloudflare</text>
    <text x="600" y="218" text-anchor="middle" font-size="27" fill="#111111">Tunnel</text>
  </g>
  <line x1="755" y1="185" x2="870" y2="185" stroke="#7c5cd6" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="880" y="110" width="290" height="150" rx="18" fill="#efeafd" stroke="#9a9aad" stroke-width="1.5"/>
    <text x="1025" y="178" text-anchor="middle" font-size="30" font-weight="600" fill="#111111">Local MCP Server</text>
    <text x="1025" y="218" text-anchor="middle" font-size="27" fill="#111111">127.0.0.1:3210</text>
  </g>

  <!-- Connector down to tool row -->
  <line x1="1025" y1="260" x2="1025" y2="465" stroke="#7c5cd6" stroke-width="4"/>
  <line x1="485" y1="465" x2="885" y2="465" stroke="#7c5cd6" stroke-width="4"/>

  <!-- Bottom row -->
  <g>
    <rect x="205" y="400" width="280" height="130" rx="18" fill="#efeafd" stroke="#9a9aad" stroke-width="1.5"/>
    <text x="345" y="478" text-anchor="middle" font-size="29" font-weight="600" fill="#111111">File Tools</text>
  </g>
  <g>
    <rect x="545" y="400" width="280" height="130" rx="18" fill="#efeafd" stroke="#9a9aad" stroke-width="1.5"/>
    <text x="685" y="462" text-anchor="middle" font-size="29" font-weight="600" fill="#111111">Command</text>
    <text x="685" y="500" text-anchor="middle" font-size="29" font-weight="600" fill="#111111">Tools</text>
  </g>
  <g>
    <rect x="885" y="400" width="280" height="130" rx="18" fill="#efeafd" stroke="#9a9aad" stroke-width="1.5"/>
    <text x="1025" y="478" text-anchor="middle" font-size="29" font-weight="600" fill="#111111">Desktop Tools</text>
